,null,32],"5,21":[null,null,29],"5,22":[null,null,30],"5,23":[null,null,30],"5,24":[null,null,33],"5,25":[null,null,17],"5,26":[null,null,17],"7,1":["LEGEND",null,34],"8,1":[null,null,17],"8,2":[null,null,35],"8,3":["ICF walls — first lift: FB footing courses, both zones (erection, snag & pour)",null,14],"8,4":[null,null,6],"8,5":[null,null,6],"8,6":[null,null,6],"8,7":[null,null,6],"8,8":[null,null,7],"9,1":[null,null,17],"9,2":[null,null,32],"9,3":["ICF walls — L1 GF walls (after the GF B&B), then L2 gables / stack / upstands (after the L1 pour)",null,14],"9,4":[null,null,6],"9,5":[null,null,6],"9,6":[null,null,6],"9,7":[null,null,6],"9,8":[null,null,7],"10,1":[null,null,17],"10,2":[null,null,29],"10,3":["Concrete pour — sized at 60 m3 per pump-day (1 day per lift here), ICF crew attends, pump on site",null,14],"10,4":[null,null,6],"10,5":[null,null,6],"10,6":[null,null,6],"10,7":[null,null,6],"10,8":[null,null,7],"11,1":[null,null,17],"11,2":[null,null,30],"11,3":["Curing — pours held to Fridays where possible so the 2 curing days fall on the weekend; a mid-week pour cures 2 working days",null,14],"11,4":[null,null,6],"11,5":[null,null,6],"11,6":[null,null,6],"11,7":[null,null,6],"11,8":[null,null,7],"12,1":[null,null,17],"12,2":[null,null,31],"12,3":["GF block & beam floor — after the FB pour (by others, 1 day by Tom's rule)",null,14],"12,4":[null,null,6],"12,5":[null,null,6],"12,6":[null,null,6],"12,7":[null,null,6],"12,8":[null,null,7],"13,1":[null,null,17],"13,2":[null,null,33],"13,3":["Vaulted roof structure, after the L2 pour (1 day by Tom's rule)",null,14],"13,4":[null,null,6],"13,5":[null,null,6],"13,6":[null,null,6],"13,7":[null,null,6],"13,8":[null,null,7],"15,1":["  RESOURCING",null,36],"16,1":["•  1 ICF crews of 8 trained installers (each crew = 2 four-man gang-equivalents) erect the wall lifts, moving to the next ready block while a floor is fitted; 1 joinery crew of 3 fits every intermediate floor and roof (Tom's rule 19.10.26: floors 1 day per plot, roofs 1 day per plot - one plot; the 'floor' here is the GF precast block & beam (by others - programme slot, the joinery crew attends), the roof is the vaulted cut roof). Programme is resource-levelled day by day (white = block waiting for a crew).",null,37],"17,1":["•  Total ICF site programme: 3 working weeks (ICF erection, floors and roofs). Section A Preliminaries are quantified against this 3-week programme.",null,37],"18,1":["•  EXTERNAL RENDER / FINISH IS EXCLUDED from this BOQ and this programme. Where a render system is later specified, allow a separate workstream — per BBA guidance, render cannot begin until the concrete core has cured for a minimum of 28 days after the final pour.",null,37],"19,1":["•  Concrete pump booked on the pour days for each group (see Section C).",null,37],"20,1":["•  Lead time for BuildEase Pre-Cut Service: 5–6 weeks from order placement; procurement runs in parallel with mobilisation.",null,37],"21,1":["•  Programme estimates are provided in good faith and must be verified by the project / site management team.",null,37],"22,1":["•  ENGLAND: the design must satisfy the Building Regulations 2010 (Approved Documents A-S) - building control by LABC / an approved inspector. ONE single-storey dwelling on a split-level ground floor (lower zone FFL 124.400 = datum 0: kitchen / dining / snug; upper zone FFL 125.000 = +600), vaulted 35 deg roof: the highest point is the chimney stack top at 6,541 above the lower FFL (ridge ~6,482, geometric) - ~6.7 m above the lowest ground (ground ASSUMED ~150 below each zone FFL - no survey), BELOW 11 m: the 11-18 m fire band does not apply. Approved Document J: the stove flue outlet height (1 m above the roof intersection, rooflights within 2.3 m) is an RFI to the stove installer. Single storey - inside the LABC Warranty 3-storey ICF cap.",null,37],"23,1":["•  Tom's rule (19.10.26): floors 1 day PER PLOT, roofs 1 day PER PLOT - one plot here, so the GF block & beam slot and the vaulted roof are shown at 1 day each. The floor row of this programme is the GF PRECAST BLOCK & BEAM BY OTHERS (beam supplier / groundworker; the joinery crew attends): lower zone 150 B&B + 150 insulation + 82 screed, upper zone 150 B&B + 150 insulation + 75 screed. The beams bear on the 8in Standard footing course (150 cut off its INSIDE face at the bearing - ICF erector coordination). Beams, blocks, insulation, screeds and craneage are NOT in this ICF BOQ (coordination quantities in the finishes package Bill 6).",null,37],"24,1":["•  Build sequence (no client programme issued): FB (one 8in Standard footing course in each floor zone - FB-Lower and FB-Upper, on the strip footing by others) -> pour -> GF block & beam floor (both zones) -> L1 GF walls (6in XR35, 8 courses to the underside of the plate at 3,341) -> pour -> L2 (raked gables, the chimney stack to 6,541 over the flue on its steel lintel / trimmers, the NE vault upstands) -> pour -> vaulted roof (C24 @ 400 cut roof on UB ridges / purlins, oak arched trusses A1-A3).",null,37],"25,1":["•  ICF pours sized at 60 m3 per pump per day from each lift's own concrete volume (every pour is 1 pump day here).",null,37],"26,1":["•  PROGRAMME (BOQ Builder sheet 'Programme', 1 ICF crew of 8 + 1 joinery crew of 3, Tom's rule floors / roofs 1 day per plot, pours at 60 m3 / pump-day, 2 days cure): 15 working days = 3 weeks. Sequence: ICF FB d0-0.42; pour d1-2; cure d2-4; GF B&B floor d4-5; ICF L1 d5-7.32; pour d9-10; ICF L2 d10-10.61; pour d11-12; cure d12-14; roof d14-15. ICF concrete 53.33 m3 (geometric, 352 ordered forms: FB 8.35 / L1 35.97 / L2 9.01) in 3 pump days. ALIGNMENT: the proposal prices 4 stillages x 5 weeks hire (GBP 1,600.00); on this programme the alignment is needed from the first ICF lift (FB, day 0) to the last pour (L2, day 12) = 3 weeks on hire - 2 weeks LESS than priced (GBP 640.00 of hire not needed on this programme). The proposal has NOT been changed - confirm the hire period with the client / site team.",null,37],"27, roved Documents A-S) - building control by LABC / an approved inspector. ONE single-storey dwelling on a split-level ground floor (lower zone FFL 124.400 = datum 0: kitchen / dining / snug; upper zone FFL 125.000 = +600), vaulted 35 deg roof: the highest point is the chimney stack top at 6,541 above the lower FFL (ridge ~6,482, geometric) - ~6.7 m above the lowest ground (ground ASSUMED ~150 below each zone FFL - no survey), BELOW 11 m: the 11-18 m fire band does not apply. Approved Document J: the stove flue outlet height (1 m above the roof intersection, rooflights within 2.3 m) is an RFI to the stove installer. Single storey - inside the LABC Warranty 3-storey ICF cap.",null,76],"8,1":["1.2",null,72],"8,2":["ENGINEER / SPECIALISTS TO DESIGN (floors, steels, roof timbers, oak, partitions and glazing are in the model for coordination only): STRUCTURAL ENGINEER: the indicative steels (UB 203 x 133 ridges / purlins / hip / valley, PFC 180 x 75 eaves beams over the NE set-backs, SHS 100 posts incl. the mullion posts in the lift-and-slide openings, the chimney-stack lintel + trimmers on 2 SHS posts); padstones / pockets in the ICF core (form at the pour); the roof (4 hip / valley heads with no prop in the model; the 16 m wing ridge as a steel); the oak trusses A1-A3; the strip footing (stepped at the zone change); the B&B bearings on the footing course and the step walls.",null,76],"9,1":["1.3",null,72],"9,2":["This package presents the finishes and ancillary-trade quantities measured by BuildEase alongside the Nudura ICF quotation for Langley Lane Farm, Middleton (ref ES26-063). It is set out as a Bill of Quantities so that the client, their quantity surveyor and trade contractors can price and coordinate the works.",null,76],"10,1":["1.4",null,72],"10,2":["Status: FOR INFORMATION, COORDINATION AND PRICING BY OTHERS - NOT FOR CONSTRUCTION. Supply and install rates are left blank deliberately - BuildEase / Tremco CPG are not pricing these trades. The Excel workbook is a live pricing document: enter rates and every amount, subtotal and total updates by formula.",null,76],"11,1":["1.5",null,72],"11,2":["The ICF kit, concrete core, pumping, ICF / floor / roof labour and the build programme are in the BuildEase BOQ Builder sheets of this workbook (Cover / Programme / Summary / A-F). The finishes cover carries a named hook (ICF_PACKAGE_TOTAL) linked to that NET TOTAL.",null,76],"12,1":["1.6",null,72],"12,2":["PROGRAMME (BOQ Builder sheet 'Programme', 1 ICF crew of 8 + 1 joinery crew of 3, Tom's rule floors / roofs 1 day per plot, pours at 60 m3 / pump-day, 2 days cure): 15 working days = 3 weeks. Sequence: ICF FB d0-0.42; pour d1-2; cure d2-4; GF B&B floor d4-5; ICF L1 d5-7.32; pour d9-10; ICF L2 d10-10.61; pour d11-12; cure d12-14; roof d14-15. ICF concrete 53.33 m3 (geometric, 352 ordered forms: FB 8.35 / L1 35.97 / L2 9.01) in 3 pump days. ALIGNMENT: the proposal prices 4 stillages x 5 weeks hire (GBP 1,600.00); on this programme the alignment is needed from the first ICF lift (FB, day 0) to the last pour (L2, day 12) = 3 weeks on hire - 2 weeks LESS than priced (GBP 640.00 of hire not needed on this programme). The proposal has NOT been changed - confirm the hire period with the client / site team.",null,76],"13,1":["1.7",null,72],"13,2":["This information is supplied in good faith for guidance and coordination only. It is not part of the Nudura ICF price and must be checked and verified by the appropriate professional (quantity surveyor, designer, engineer or supplier) before use. Only the Nudura ICF formwork and associated accessories are included in our price.",null,77],"14,1":["1.8",null,72],"14,2":["Quantities are measured from the BuildEase quotation model (rebuilt 02.11.2026) of the client's planning / buildability drawings (LR Design: GF plan, elevations, sections C-C / D-D) and M. Whalley's levels sketch of 01.11.2026; no allowance for waste is included unless stated. Quantity columns are FB (footing courses) / GF (block & beam floor) / L1 (GF walls) / L2 (gables, stack, upstands) and the Roof; the Site total is their sum. Rates and amounts are by others.",null,77],"16,1":["2  Basis of measurement",null,100],"17,1":["2.1",null,72],"17,2":["Measured generally in accordance with the principles of NRM2 (RICS New Rules of Measurement): work measured net as fixed in position, grouped by work section, units m / m2 / nr / item. NRM2 is referenced for structure only; descriptions are BuildEase's own.",null,76],"18,1":["2.2",null,72],"18,2":["Quantities are NET. No allowance for waste, laps, cutting or breakage is included unless stated; an \"Order guide\" with a stated waste % is guidance only.",null,76],"19,1":["2.3",null,72],"19,2":["Quantity columns: FB (footing courses, both zones), GF (block & beam floor + ground-floor items), L1 (GF walls and everything fixed to them), L2 (gables, chimney stack, vault upstands) and the ROOF. One dwelling: the Site total is the sum of the columns (multiplier 1) and is a live formula.",null,76],"20,1":["2.4",null,72],"20,2":["Sources: the client's planning / buildability drawings (LR Design: GF plan, elevations, sections C-C / D-D) and M. Whalley's levels sketch of 01.11.2026; the BuildEase quotation model 03_Models/LF2_build.skp through its spec (04_Logs/specs/LF2_spec.json, LF2_floors.json), the window fit (04_Logs/lf2/lfw_fit.json), the structure dump (roof members, steels, oak trusses, partitions) and the Report Tool component export (04_Logs/takeoff/LF_components.json: inner / outer EPS face areas of the 570 modelled forms, openings net). Measured offline by 05_Scripts/lf_boq.py (no live model).",null,76],"22,1":["3  Assumptions",null,100],"23,1":["3.1",null,72],"23,2":["Walls: footing courses 8in Standard (336.6 overall), GF walls / gables / stack / upstands 6in XR35 (355.6). Frames tight to the back of the outer EPS (101.8): internal reveal ~269, external reveal return ~172.",null,76],"24,1":["3.2",null,72],"24,2":["Levels: lower FFL 124.400 = 0 (kitchen / dining / snug), upper FFL 125.000 = +600; FB-Lower -689, FB-Upper -231.8; L1 to the underside of the plate 3,341 (plate top 3,385); stack top 6,541; ridge ~6.48 m (geometric, 35 deg planes over the plate line, heel ignored).",null,76],"25,1":["3.3",null,72],"25,2":["External finish: vertical timber cladding (charred larch or similar) on a ventilated batten zone; feature brickwork / stone provisional; ground ~150 below each zone FFL (not surveyed).",null,76],"26,1":["3.4",null,72],"26,2":["Floors: GF precast B&B BY OTHERS in two zones per LF2_floors.json; vaulted ceilings on the slope over the whole internal plan (flat MF ceilings to the stud-walled rooms provisional, not deducted).",null,76],"27,1":["3.5",null,72],"27,2":["Internal doors: D-01 to D-11 (11) from the plan + 3 provisional cupboard leaves, ironmongery per leaf. Partitions: indicative, from the partition model (blockwork to the vault, studs to 2,537).",null,76],"28,1":["3.6",null,72],"28,2":["Roof: 35 deg cut roof, member counts / sections from the roof model; hips / ridges / valley from the straight-skeleton height field; 6 rooflights and 8 RWPs counted on the plan crops (TBC).",null,76],"30,1":["4  Exclusions (not measured in this package)",null,100],"31,1":["4.1",null,72],"31,2":["Nudura ICF formwork and accessories (in the Nudura price). ICF wall concrete, pumping, ICF / floor / roof labour and preliminaries are in the BOQ Builder sheets.",null,76],"32,1":["4.2",null,72],"32,2":["External works, drainage, landscaping, the gabion retaining wall, car parking, boundary fences, the entrance porch (not modelled).",null,76],"33,1":["4.3",null,72],"33,2":["Floor finishes, decorations, kitchen, sanitaryware, the stove / flue liner, M&E services (heating / UFH, ventilation, electrics) and builder's work.",null,76],"34,1":["4.4",null,72],"34,2":["Fire-stopping and fire-rated service penetrations, sealants and mastics, except where expressly described.",null,76],"36,1":["5  Open items / to be confirmed",null,100],"37,1":["5.1",null,72],"37,2":["STRUCTURAL ENGINEER: the indicative steels (UB 203 x 133 ridges / purlins / hip / valley, PFC 180 x 75 eaves beams over the NE set-backs, SHS 100 posts incl. the mullion posts in the lift-and-slide openings, the chimney-stack lintel + trimmers on 2 SHS posts); padstones / pockets in the ICF core (form at the pour); the roof (4 hip / valley heads with no prop in the model; the 16 m wing ridge as a steel); the oak trusses A1-A3; the strip footing (stepped at the zone change); the B&B bearings on the footing course and the step walls.",null,76],"38,1":["5.2",null,72],"38,2":["BEAM SUPPLIER: the lower / upper zone B&B layouts (Bill 6), bearings on the 8in Standard footing course (150 cut off its inside face) and the TYPE A step walls, vents / sleeves through the ICF (form BEFORE the pour).",null,76],"39,1":["5.3",null,72],"39,2":["ARCHITECT / BUILDING CONTROL (England, Approved Documents): flue height (Approved Document J - RFI to the stove installer: outlet 1 m above the roof intersection, rooflights within 2.3 m); feature brickwork / stone extents; the entrance porch (projects past the roof outline - not modelled); A12 ICF return vs blockwork (RFI); door schedule (privacy sets, cupboards); rooflight count / sizes; Part K guarding at the steps; Part O (large glazing).",null,76],"40,1":["5.4",null,72],"40,2":["Assumed (not drawn / not modelled): ground ~150 below each zone FFL; cladding build-up (battens + counter-battens on a membrane); the MF ceiling areas; 3 cupboard leaves; 4 privacy sets; 6 rooflights; 8 downpipes; the internal steps; the canopy.",null,76],"42,1":["6  What IS in the Nudura price (Quotation ES26-063, NET GBP 24,103.56)",null,100],"43,1":["6.1",null,72],"43,2":["Nudura ICF kit as modelled in the BuildEase Design Suite: 570 forms modelled (FB 56 / L1 409 / L2 105) / 352 to order after the cut optimiser (FB 44 / L1 244 / L2 64), 8in Standard footing courses + 6in XR35 walls, materials GBP 18,710.85.",null,7
